# Local development stack. The `db` mirrors the credentials of the postgres-db
# deployed by zest-cloud-k8s (zest/zest/zest) so DATABASE_URLs are interchangeable.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zest
      POSTGRES_PASSWORD: zest
      POSTGRES_DB: zest
    ports:
      # Host 5433 to avoid clashing with a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - zest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zest -d zest"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ZEST_API_DATABASE_URL: postgresql+psycopg://zest:zest@db:5432/zest
      ZEST_API_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8091:8091"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve.
    command: ["sh", "-c", "alembic upgrade head && uvicorn zest_data_api.main:app --host 0.0.0.0 --port 8091"]

volumes:
  zest_pgdata:
